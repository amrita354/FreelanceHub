<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="dark" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Projects - FreelanceHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
/* ===== Theme tokens (same as the rest of the site) ===== */
:root, :root[data-theme="dark"] {
  --bg:#060817; --surface:rgba(24,29,70,.52); --surface-strong:rgba(30,36,84,.78);
  --border:rgba(165,175,255,.16); --border-strong:rgba(190,198,255,.38);
  --ink:#eef0ff; --muted:#a6acd6; --accent:#8b7bff; --accent-2:#46d4ff;
  --btn-grad:linear-gradient(135deg,#7c6cff,#4aa8ff); --btn-edge:#3427b0; --glow:rgba(124,108,255,.55);
  --ok:#6ee7b7; --ok-bg:rgba(52,211,153,.16); --input-bg:#0c102e; --input-line:rgba(165,175,255,.22);
  --shadow:0 30px 60px -30px rgba(0,0,0,.8); --slab:rgba(130,140,255,.2); --nav-bg:rgba(8,10,30,.6);
  --aurora-a:rgba(124,92,255,.38); --aurora-b:rgba(40,190,255,.26); --aurora-c:rgba(255,90,200,.18); --particle:200,195,255;
}
:root[data-theme="light"] {
  --bg:#f3f2fd; --surface:rgba(255,255,255,.66); --surface-strong:rgba(255,255,255,.9);
  --border:rgba(90,80,200,.16); --border-strong:rgba(90,80,200,.4);
  --ink:#1b1d3b; --muted:#585e87; --accent:#5b4bdb; --accent-2:#0a8fc2;
  --btn-grad:linear-gradient(135deg,#6657e8,#3b82f6); --btn-edge:#3a2fa8; --glow:rgba(91,75,219,.3);
  --ok:#0f7a58; --ok-bg:rgba(16,150,105,.14); --input-bg:#ffffff; --input-line:rgba(90,80,200,.28);
  --shadow:0 30px 60px -32px rgba(60,50,140,.45); --slab:rgba(90,80,200,.2); --nav-bg:rgba(243,242,253,.72);
  --aurora-a:rgba(140,120,255,.32); --aurora-b:rgba(80,200,255,.26); --aurora-c:rgba(255,150,210,.24); --particle:90,75,210;
}

/* ===== Base + backdrop ===== */
body { background:var(--bg); color:var(--ink); font-family:"DM Sans",system-ui,sans-serif; line-height:1.6; overflow-x:hidden; min-height:100vh; transition:background .5s,color .5s; }
h1,h2,h3,.brand { font-family:"Bricolage Grotesque","DM Sans",sans-serif; letter-spacing:-.02em; }
.fh-nav, main { position:relative; z-index:2; }
#sky { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
.aurora { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.aurora i { position:absolute; width:55vmax; height:55vmax; border-radius:50%; filter:blur(90px); animation:drift 26s ease-in-out infinite alternate; }
.aurora i:nth-child(1){ background:var(--aurora-a); top:-22vmax; left:-12vmax; }
.aurora i:nth-child(2){ background:var(--aurora-b); top:10vmax; right:-20vmax; animation-delay:-9s; }
.aurora i:nth-child(3){ background:var(--aurora-c); bottom:-28vmax; left:20vw; animation-delay:-16s; }
@keyframes drift { to { transform:translate3d(6vmax,4vmax,0) scale(1.12); } }
.cursor-glow { position:fixed; left:0; top:0; width:520px; height:520px; margin:-260px 0 0 -260px; border-radius:50%; z-index:1; pointer-events:none; background:radial-gradient(circle,var(--glow),transparent 65%); opacity:0; transition:opacity .4s; mix-blend-mode:screen; }
.cursor-glow.on { opacity:.3; }
:root[data-theme="light"] .cursor-glow { display:none; }

/* ===== Navbar + buttons ===== */
.fh-nav { position:sticky; top:0; background:var(--nav-bg); backdrop-filter:blur(16px) saturate(140%); -webkit-backdrop-filter:blur(16px) saturate(140%); border-bottom:1px solid var(--border); }
.brand { font-weight:800; font-size:1.35rem; color:var(--ink); text-decoration:none; display:inline-flex; align-items:center; gap:.55rem; }
.brand:hover { color:var(--ink); }
.brand-mark { width:30px; height:30px; border-radius:9px; background:var(--btn-grad); display:inline-grid; place-items:center; color:#fff; font-size:.95rem; box-shadow:0 3px 0 var(--btn-edge),0 0 22px var(--glow); }
.theme-toggle { width:42px; height:42px; border-radius:12px; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); display:grid; place-items:center; cursor:pointer; transition:transform .15s,box-shadow .3s; }
.theme-toggle:hover { transform:translateY(-2px); box-shadow:0 0 22px var(--glow); }
.theme-toggle svg { width:20px; height:20px; }
.theme-toggle .i-sun { display:none; }
:root[data-theme="dark"] .theme-toggle .i-sun { display:block; }
:root[data-theme="dark"] .theme-toggle .i-moon { display:none; }
.btn { border-radius:12px; font-weight:600; padding:.6rem 1.2rem; border:0; transition:transform .08s,box-shadow .08s,filter .15s; }
.btn-fh { background:var(--btn-grad); color:#fff; box-shadow:0 5px 0 var(--btn-edge),0 14px 26px -8px var(--glow); }
.btn-fh:hover { color:#fff; transform:translateY(-2px); filter:brightness(1.08); }
.btn-fh:active { transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.4); }
.btn-fh-outline { background:var(--surface); border:1px solid var(--border-strong); color:var(--ink); box-shadow:0 5px 0 var(--border-strong); }
.btn-fh-outline:hover { color:var(--ink); transform:translateY(-2px); background:var(--surface-strong); }
.btn-fh-outline:active { transform:translateY(4px); box-shadow:0 1px 0 var(--border-strong); }
.btn:focus-visible,a:focus-visible,.theme-toggle:focus-visible,.search input:focus-visible { outline:3px solid var(--accent-2); outline-offset:3px; }

/* ===== Glass + 3D slab cards ===== */
.glass { position:relative; background:var(--surface); border:1px solid var(--border); border-radius:20px; box-shadow:inset 0 1px 0 rgba(255,255,255,.14),var(--shadow); }
.glass::after { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; opacity:0; transition:opacity .3s; background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.14),transparent 60%); }
:root[data-theme="light"] .glass::after { background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%),rgba(124,108,255,.14),transparent 60%); }
.glass:hover::after { opacity:1; }
.slab { background:var(--surface-strong); transform-style:preserve-3d; transition:transform .2s ease-out;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 0 var(--slab),0 2px 0 var(--slab),0 3px 0 var(--slab),0 4px 0 var(--slab),0 5px 0 var(--slab),0 6px 0 var(--slab),var(--shadow); }
.slab.is-tilting { transition:transform .05s linear; }

/* ===== Projects page (different layout from the home page) ===== */
.page { padding:2.5rem 0 4rem; perspective:1800px; }
.eyebrow { display:inline-flex; align-items:center; gap:.5rem; font-size:.8rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-2); }
.eyebrow::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--accent-2); box-shadow:0 0 12px var(--accent-2); }
.top { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:1rem; margin-bottom:1.6rem; }
.top h1 { font-weight:800; font-size:clamp(2rem,4.5vw,3rem); line-height:1.05; margin:.4rem 0 .4rem; text-shadow:0 0 40px var(--glow); }
.top p { color:var(--muted); margin:0; }
.count { display:inline-flex; align-items:center; gap:.5rem; padding:.5rem 1rem; border-radius:999px; background:var(--ok-bg); color:var(--ok); font-weight:600; }
.search { position:relative; display:block; margin-bottom:2rem; }
.search svg { position:absolute; left:1.1rem; top:50%; transform:translateY(-50%); width:20px; height:20px; color:var(--muted); pointer-events:none; }
.search input { width:100%; background:var(--input-bg); color:var(--ink); border:1px solid var(--input-line); border-radius:16px; padding:1rem 1.2rem 1rem 3.1rem; font:inherit; box-shadow:inset 0 2px 6px rgba(0,0,0,.25),var(--shadow); transition:border-color .2s,box-shadow .2s; }
.search input::placeholder { color:var(--muted); opacity:.75; }
.search input:focus { outline:none; border-color:var(--accent); box-shadow:inset 0 2px 6px rgba(0,0,0,.2),0 0 0 4px rgba(139,123,255,.25),0 0 28px var(--glow); }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:1.5rem; }
.proj { padding:1.6rem; display:flex; flex-direction:column; }
.who { display:flex; align-items:center; gap:.8rem; margin-bottom:1.1rem; }
.avatar { width:44px; height:44px; border-radius:14px; background:var(--btn-grad); color:#fff; display:grid; place-items:center; font:800 1.15rem "Bricolage Grotesque",sans-serif; box-shadow:0 4px 0 var(--btn-edge),0 0 20px var(--glow); translate:0 0 30px; }
.who .name { font-weight:600; line-height:1.2; }
.who .role { font-size:.8rem; color:var(--muted); }
.pill { margin-left:auto; display:inline-block; font-size:.78rem; font-weight:700; letter-spacing:.04em; padding:.25rem .75rem; border-radius:999px; background:var(--ok-bg); color:var(--ok); translate:0 0 36px; }
.proj h2 { font-size:1.35rem; font-weight:700; margin:0 0 .5rem; translate:0 0 22px; }
.desc { color:var(--muted); margin:0 0 1.3rem; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.facts { display:grid; grid-template-columns:1.2fr 1fr; gap:.8rem; margin-top:auto; }
.fact { padding:.8rem 1rem; border-radius:14px; background:var(--surface); border:1px solid var(--border); }
.fact small { display:block; font-size:.76rem; font-weight:500; color:var(--muted); }
.fact strong { font-size:1.1rem; }
.fact.money { translate:0 0 26px; }
.fact.money strong { font-family:"Bricolage Grotesque",sans-serif; font-size:1.45rem; color:var(--accent-2); }
.proj .btn { margin-top:1.3rem; text-align:center; translate:0 0 34px; }
.none { padding:2.5rem 1.5rem; text-align:center; color:var(--muted); }
.none.hide { display:none; }
@media (max-width:420px) { .grid { grid-template-columns:1fr; } .facts { grid-template-columns:1fr; } }
@media (prefers-reduced-motion:reduce) { .aurora i { animation:none; } .slab,body { transition:none; } }
    </style>
    <script>
(function () {
  var root = document.documentElement, theme = "dark";
  try { theme = localStorage.getItem("fh-theme") || "dark"; } catch (e) {}
  root.setAttribute("data-theme", theme); root.setAttribute("data-bs-theme", theme);

  document.addEventListener("DOMContentLoaded", function () {
    var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    var fine = matchMedia("(hover: hover) and (pointer: fine)").matches;
    document.body.insertAdjacentHTML("afterbegin",
      '<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div><canvas id="sky" aria-hidden="true"></canvas><div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>');

    /* Theme toggle */
    var rgb = "200,195,255";
    function readTheme() { rgb = getComputedStyle(root).getPropertyValue("--particle").trim() || rgb; }
    var btn = document.getElementById("themeToggle");
    btn.setAttribute("aria-label", "Switch between dark and light mode");
    btn.innerHTML = '<svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
    btn.addEventListener("click", function () {
      var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next); root.setAttribute("data-bs-theme", next);
      try { localStorage.setItem("fh-theme", next); } catch (e) {}
      readTheme(); if (reduce) draw(0);
    });

    /* Starfield */
    var cv = document.getElementById("sky"), ctx = cv.getContext("2d");
    var W, H, dpr, stars = [], mx = 0, my = 0;
    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2); W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr;
      var n = Math.min(150, Math.round(innerWidth * innerHeight / 11000)); stars = [];
      for (var i = 0; i < n; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, r: (Math.random() * 1.4 + .3) * dpr, d: Math.random() * .9 + .1, vy: (Math.random() * .12 + .03) * dpr, tw: Math.random() * 1.6 + .5, ph: Math.random() * 6.28 });
    }
    function draw(t) {
      ctx.clearRect(0, 0, W, H);
      var dark = root.getAttribute("data-theme") === "dark";
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        if (!reduce) { s.y -= s.vy * s.d; if (s.y < -5) { s.y = H + 5; s.x = Math.random() * W; } }
        var a = (.25 + .75 * (.5 + .5 * Math.sin(t / 1000 * s.tw + s.ph))) * (dark ? 1 : .55);
        ctx.beginPath(); ctx.arc(s.x + mx * s.d * 26 * dpr, s.y + my * s.d * 26 * dpr, s.r, 0, 6.283);
        ctx.fillStyle = "rgba(" + rgb + "," + a + ")"; ctx.shadowColor = "rgba(" + rgb + ",.9)"; ctx.shadowBlur = s.r * 5; ctx.fill();
      }
      ctx.shadowBlur = 0;
    }
    function loop(t) { draw(t); if (!document.hidden) requestAnimationFrame(loop); }
    document.addEventListener("visibilitychange", function () { if (!document.hidden && !reduce) requestAnimationFrame(loop); });
    readTheme(); resize(); addEventListener("resize", function () { resize(); if (reduce) draw(0); });
    if (reduce) draw(0); else requestAnimationFrame(loop);

    /* Search filter */
    var input = document.getElementById("q"), cards = document.querySelectorAll(".proj"), none = document.getElementById("noMatch");
    input.addEventListener("input", function () {
      var q = input.value.trim().toLowerCase(), shown = 0;
      cards.forEach(function (c) { var ok = c.textContent.toLowerCase().indexOf(q) > -1; c.style.display = ok ? "" : "none"; if (ok) shown++; });
      none.classList.toggle("hide", shown > 0 || cards.length === 0);
    });

    if (reduce || !fine) return;

    /* Pointer effects */
    var glow = document.getElementById("cursorGlow");
    addEventListener("mousemove", function (e) { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; glow.style.transform = "translate(" + e.clientX + "px," + e.clientY + "px)"; glow.classList.add("on"); });
    document.addEventListener("mouseleave", function () { glow.classList.remove("on"); });
    document.querySelectorAll(".glass").forEach(function (el) {
      el.addEventListener("mousemove", function (e) {
        var r = el.getBoundingClientRect(); el.style.setProperty("--mx", (e.clientX - r.left) + "px"); el.style.setProperty("--my", (e.clientY - r.top) + "px");
        if (el.classList.contains("slab")) { var x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5; el.classList.add("is-tilting"); el.style.transform = "perspective(1100px) rotateX(" + (-y * 8) + "deg) rotateY(" + (x * 10) + "deg) translateZ(6px)"; }
      });
      el.addEventListener("mouseleave", function () { el.classList.remove("is-tilting"); el.style.transform = ""; });
    });
  });
})();
    </script>
</head>
<body>

<nav class="fh-nav">
    <div class="container d-flex justify-content-between align-items-center py-3">
        <a class="brand" th:href="@{/}"><span class="brand-mark" aria-hidden="true">F</span>FreelanceHub</a>
        <div class="d-flex align-items-center gap-2">
            <button type="button" class="theme-toggle" id="themeToggle"></button>
            <a href="/dashboard" class="btn btn-fh-outline">Dashboard</a>
            <a th:href="@{/logout}" class="btn btn-fh">Logout</a>
        </div>
    </div>
</nav>

<main class="page">
    <div class="container">

        <div class="top">
            <div>
                <span class="eyebrow">Marketplace</span>
                <h1>Available projects</h1>
                <p>Explore projects posted by clients.</p>
            </div>
            <span class="count"><span th:text="${#lists.size(projects)}">0</span> open projects</span>
        </div>

        <label class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="search" id="q" placeholder="Search by title, skill or client" autocomplete="off">
        </label>

        <div th:if="${#lists.isEmpty(projects)}" class="glass none">No open projects available right now.</div>
        <div id="noMatch" class="glass none hide">No projects match your search.</div>

        <div class="grid">
            <article class="glass slab proj" th:each="project : ${projects}">
                <div class="who">
                    <span class="avatar" th:text="${project.client.name != null and !#strings.isEmpty(project.client.name)} ? ${#strings.toUpperCase(#strings.substring(project.client.name,0,1))} : '?'">C</span>
                    <div>
                        <div class="name" th:text="${project.client.name}">Client Name</div>
                        <div class="role">Client</div>
                    </div>
                    <span class="pill">OPEN</span>
                </div>

                <h2 th:text="${project.title}">Project Title</h2>
                <p class="desc" th:text="${project.description}">Project Description</p>

                <div class="facts">
                    <div class="fact money"><small>Budget</small><strong>₹<span th:text="${project.budget}"></span></strong></div>
                    <div class="fact"><small>Deadline</small><strong th:text="${project.deadline}"></strong></div>
                </div>

                <a th:href="@{/projects/{id}/proposal(id=${project.id})}" class="btn btn-fh">Submit proposal</a>
            </article>
        </div>

    </div>
</main>

</body>
</html>
